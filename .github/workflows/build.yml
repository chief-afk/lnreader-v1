name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create .env (tracker client ids)
        run: |
          {
            echo "ANILIST_CLIENT_ID=${{ secrets.ANILIST_CLIENT_ID }}"
            echo "MYANIMELIST_CLIENT_ID=${{ secrets.MYANIMELIST_CLIENT_ID }}"
          } > .env

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get Version Info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          mv app-release.apk lnreader-v1-${{ steps.version.outputs.version }}-r${{ steps.version.outputs.commit_count }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lnreader-v1-${{ steps.version.outputs.version }}-r${{ steps.version.outputs.commit_count }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
